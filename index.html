<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMX Post Studio</title>
  </head>
  <body>
    <svg class="imps-distortion-filters" aria-hidden="true" width="0" height="0" focusable="false">
      <defs>
        <filter id="imps-site-distortion" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.007 0.018" numOctaves="2" seed="13" result="noise">
            <animate attributeName="baseFrequency" dur="3.8s" values="0.007 0.018;0.014 0.032;0.004 0.024;0.011 0.016;0.007 0.018" repeatCount="indefinite" />
          </feTurbulence>
          <feDisplacementMap id="imps-site-displacement" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="B">
            <animate id="imps-site-distortion-ramp" attributeName="scale" begin="indefinite" dur=".65s" values="0;10;25;18" keyTimes="0;.35;.72;1" calcMode="spline" keySplines=".16 1 .3 1;.16 1 .3 1;.16 1 .3 1" fill="freeze" />
            <animate attributeName="scale" begin="imps-site-distortion-ramp.end" dur="2.6s" values="18;27;16;30;18" repeatCount="indefinite" />
          </feDisplacementMap>
        </filter>
        <filter id="imps-site-distortion-static" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.011 0.024" numOctaves="2" seed="13" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="B" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
