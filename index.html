<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark only" />
    <meta name="supported-color-schemes" content="light dark only" />
    <meta name="theme-color" content="#f2efe8" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('imx-post-studio-theme')
          const theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          const background = theme === 'light' ? '#f2efe8' : '#171716'
          const root = document.documentElement
          root.dataset.theme = theme
          root.style.setProperty('color-scheme', 'light dark only')
          root.style.setProperty('supported-color-schemes', 'light dark only')
          root.style.backgroundColor = background
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', background)
        } catch {
          // Static light defaults above remain usable when storage is unavailable.
        }
      })()
    </script>
    <title>IMX Post Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
